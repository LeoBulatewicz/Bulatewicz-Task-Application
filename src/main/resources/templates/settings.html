<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/mainLayout :: mainHead}"></head>
<head>
    <style>
        :root {
            --sidebar-width: 260px;
            --safe-top: env(safe-area-inset-top);
            --safe-bottom: env(safe-area-inset-bottom);
            --safe-left: env(safe-area-inset-left);
            --safe-right: env(safe-area-inset-right);
        }

        .glass-input {
            background: rgba(255, 255, 255, 0.15) !important;
            border: 1px solid rgba(255, 255, 255, 0.2) !important;
            border-radius: 18px !important;
            backdrop-filter: blur(12px);
            padding: 16px 20px;
            font-size: 1.1rem;
            transition: all 0.2s ease;
        }

        .glass-input:focus {
            background: rgba(255, 255, 255, 0.25) !important;
            border-color: rgba(255, 255, 255, 0.4) !important;
            box-shadow: 0 0 0 4px rgba(0, 122, 255, 0.1);
        }

        .task-card {
            background: rgba(255, 255, 255, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 32px;
            padding: 60px 50px;
            width: 100%;
            max-width: 520px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.08);
            backdrop-filter: blur(20px);
        }

        .btn-deploy {
            background: #1d1d1f;
            color: white;
            border-radius: 18px;
            padding: 16px 40px;
            font-weight: 600;
            font-size: 1.1rem;
            border: none;
            transition: all 0.2s ease;
        }

        .btn-deploy:hover {
            background: #000;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .settings-viewport {
            margin-left: var(--sidebar-width);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-title {
            font-size: 2.2rem;
            letter-spacing: -0.02em;
        }

        @media (max-width: 768px) {
            .settings-viewport {
                margin-left: 13vw;
                padding-top: var(--safe-top);
                padding-bottom: var(--safe-bottom);
            }

            .task-card {
                width: 100%;
                max-width: none;
                margin-bottom: var(--safe-bottom);
            }
        }
    </style>
</head>
<body>
<div class="bg"></div>
<div class="app-viewport">
    <div th:replace="~{fragments/mainLayout :: mainLayout}"></div>

    <div class="settings-viewport">
        <div class="task-card text-center">

            <div sec:authorize="isAuthenticated()">
                <div class="mb-4">
                    <i class="bi bi-person-check fs-1 text-primary"></i>
                </div>
                <h2 class="fw-bold mb-2">Account Active</h2>
                <p class="text-secondary small mb-4">You are <span th:text="${#authentication.name}">User</span></p>
                <div class="d-grid gap-3 mt-4">
                    <form th:action="@{/logout}" method="post">
                        <button type="submit" class="btn btn-deploy w-100 py-3">Sign Out</button>
                    </form>
                    <form th:action="@{/deleteAccount}" method="post">
                        <button type="submit" class="btn btn-deploy w-100 py-3">Delete Account</button>
                    </form>
                </div>
            </div>

            <div sec:authorize="isAnonymous()">

                <div th:if="${param.register}">
                    <div class="mb-4"><i class="bi bi-person-plus fs-1 text-primary"></i></div>
                    <h2 class="fw-bold mb-2">Create Account</h2>
                    <form th:action="@{/register}" method="post">
                        <div class="mb-3 text-start">
                            <label class="form-label small fw-bold ms-2">Username</label>
                            <input type="text" name="username" class="form-control glass-input" required>
                        </div>
                        <div class="mb-4 text-start">
                            <label class="form-label small fw-bold ms-2">Password</label>
                            <input type="password" name="password" class="form-control glass-input" required>
                        </div>
                        <button type="submit" class="btn btn-deploy w-100 mb-3">Create Account</button>
                        <a th:href="@{/settings}" class="small text-decoration-none text-primary">Back to Sign In</a>
                    </form>
                </div>

                <div th:unless="${param.register}">
                    <div class="mb-4"><i class="bi bi-shield-lock fs-1 text-primary"></i></div>
                    <h2 class="fw-bold mb-2">Member Access</h2>
                    <form th:action="@{/login}" method="post">
                        <div class="mb-3 text-start">
                            <label class="form-label small fw-bold ms-2">Username</label>
                            <input type="text" name="username" class="form-control glass-input" required>
                        </div>
                        <div class="mb-4 text-start">
                            <label class="form-label small fw-bold ms-2">Password</label>
                            <input type="password" name="password" class="form-control glass-input" required>
                        </div>
                        <button type="submit" class="btn btn-deploy w-100 mb-3">Sign In</button>
                        <a th:href="@{/settings(register=true)}" class="small text-decoration-none text-primary">Create Account</a>
                    </form>
                </div>

            </div>
        </div>
    </div>
</div>
</body>
</html>
