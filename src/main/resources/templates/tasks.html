<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:insert="~{fragments/mainLayout :: mainHead}"></head>
<head>
    <style>
        .text-priority-HIGH { color: #ff3b30 !important;}
        .text-priority-MEDIUM { color: #007aff !important;}
        .text-priority-LOW { color: #34c759 !important;}

        .bg-priority-HIGH { background-color: #ff3b30 !important;}
        .bg-priority-MEDIUM { background-color: #007aff !important;}
        .bg-priority-LOW { background-color: #34c759 !important;}

        .bg-overdue { background-color: #692926 !important; }

        .border-overdue {
            border: 2px solid rgba(255, 59, 48, 0.5) !important;
            box-shadow: 0 0 10px rgba(255, 59, 48, 0.2);
        }

        .task-container {
            margin-left: var(--sidebar-width);
            padding: 150px 40px 40px 40px;
            display: flex;
            flex-direction: column;
            align-items: start;
            transition: margin-left 0.3s ease;
        }

        .task-container .task-card {
            width: 100%;
            max-width: 85vw;
            min-height: 11vh;
            height: auto;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .task-card h5 {
            font-size: clamp(1rem, 2vw + 0.5rem, 1.25rem);
            line-height: 1.2;
            word-wrap: break-word;
        }

        .task-card .badge {
            font-size: clamp(0.6rem, 1vw, 0.75rem) !important;
            padding: 0.4em 0.8em !important;
        }

        .task-card .text-secondary {
            font-size: clamp(0.75rem, 1.2vw, 0.9rem);
            margin-top: 4px;
        }

        .add-task-bar {
            position: fixed;
            top: 20px;
            left: var(--sidebar-width);
            right: 0;
            margin: 0 auto;
            width: 90%;
            max-width: 800px;
            height: 70px;
            padding: 0 30px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50px;
            z-index: 999;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s ease;
        }

        .add-task-bar .form-control,
        .add-task-bar .dropdown-toggle,
        .add-task-bar .btn-primary {
            background: rgba(255, 255, 255, 0.2) !important;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3) !important;
            border-radius: 30px !important;
            height: 45px;
            color: #000;
            font-weight: 500;
            transition: 0.3s;
            padding: 0 20px;
            min-width: 100px;
        }

        .add-task-bar .form-control::placeholder {
            color: rgba(0, 0, 0, 0.5);
        }

        .add-task-bar .form-control:hover,
        .add-task-bar .dropdown-toggle:hover,
        .add-task-bar .btn-primary:hover {
            background: rgba(255, 255, 255, 0.3) !important;
            border-color: rgba(255, 255, 255, 0.5) !important;
        }

        .flatpickr-input {
            background: transparent !important;
        }

        .dropdown-menu {
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
        }

        .dropdown-toggle {
            background: rgba(255, 255, 255, 0.2) !important;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3) !important;
            border-radius: 10px;
            color: #000;
            font-weight: 500;
            height: 45px;
            transition: 0.3s;
        }

        .add-task-bar .form-control, .add-task-bar .form-select {
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            flex: 1;
            min-width: 120px;
        }

        .add-task-bar input[name="description"] {
            min-width: 200px;
            flex: 3;
        }

        @media (max-width: 768px) {
            .task-container {
                margin-left: var(--sidebar-collapsed-width);
                padding: 150px 20px 20px 20px;
            }

            .task-container .task-card {
                width: 100%;
            }

            .add-task-bar {
                left: var(--sidebar-collapsed-width);
                width: 95%;
                top: 10px;
                height: auto;
                padding: 15px;
                flex-direction: column;
                border-radius: 20px;
            }

            .add-task-bar .form-control,
            .add-task-bar .dropdown,
            .add-task-bar .btn-primary {
                width: 100% !important;
            }
        }

    </style>
</head>
<body>
<div class="app-viewport">
    <div th:replace="~{fragments/mainLayout :: mainLayout}"></div>

    <form th:action="@{/createTask}" method="post" class="add-task-bar">
        <input type="text" name="description" class="form-control"
               placeholder="Task Description" style="flex: 3;" required>
        <input type="text" id="datePicker" name="dueDate" class="form-control"
               placeholder="Due Date" style="flex: 1.5;">

        <div class="dropdown" style="flex: 1.2;">
            <input type="hidden" name="priority" id="priorityInput" value="MEDIUM">

            <button class="btn dropdown-toggle w-100 text-primary" type="button"
                    data-bs-toggle="dropdown" id="priorityBtn">
                Medium
            </button>
            <ul class="dropdown-menu shadow">
                <li><button type="button" class="dropdown-item text-priority-HIGH" onclick="setPriority('High')">High</button></li>
                <li><button type="button" class="dropdown-item text-priority-MEDIUM" onclick="setPriority('Medium')">Medium</button></li>
                <li><button type="button" class="dropdown-item text-priority-LOW" onclick="setPriority('Low')">Low</button></li>
            </ul>
        </div>

        <button type="submit" class="btn btn-primary rounded-pill px-4">Add Task</button>
    </form>

    <div class="task-container">
        <div class="task-card"
             th:each="task : ${tasks}"
             th:classappend="${task.status.name() == 'OVERDUE' ? 'border-overdue' : ''}">
            <div class="d-flex align-items-center mb-1">
                <h5 class="mb-0 fw-bold me-3"
                    th:text="${task.description}"
                    th:classappend="'text-priority-' + ${task.priority}">
                    Task Title
                </h5>
                <span class="badge rounded-pill"
                    style="font-size: 0.65rem; padding: 6px 12px;"
                      th:text="${task.status}"
                      th:classappend="${task.status.name() == 'OVERDUE'} ? 'bg-overdue' : 'bg-priority-' + ${task.priority}">
                    STATUS
                </span>
            </div>

            <span class="text-secondary small">
                <i class="bi bi-calendar4-event me-2"></i>
                Due: <span th:text="${task.dueDate != null ? #temporals.format(task.dueDate, 'MM-dd-yyyy') : 'Never'}">Never</span>
            </span>
        </div>
    </div>
</div>
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script>
    flatpickr("#datePicker", {
        altInput: true,
        altFormat: "F j, Y",
        dateFormat: "Y-m-d",
        monthSelectorType: "dropdown",
        allowInput: true
    });

    function setPriority(level) {
        const input = document.getElementById('priorityInput');
        const btn = document.getElementById('priorityBtn');

        //Java Enum in Uppercase
        input.value = level.toUpperCase();

        btn.innerText = level;

        btn.classList.remove('text-danger', 'text-primary', 'text-success');
        if (level === 'High') btn.classList.add('text-danger');
        else if (level === 'Medium') btn.classList.add('text-primary');
        else if (level === 'Low') btn.classList.add('text-success');
    }
</script>
</html>
